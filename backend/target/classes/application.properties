# Nome da Aplicação e Porta
spring.application.name=mina-backend
server.port=8080

# Conexão com o MySQL do Docker
spring.datasource.url=jdbc:mysql://localhost:3306/mina_iot_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do JPA/Hibernate (Cria as tabelas no banco automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect